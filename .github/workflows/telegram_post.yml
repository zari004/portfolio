name: Telegram Design Post

on:
  schedule:
    # Har 30 daqiqada tekshiradi — schedule.json da vaqt mos kelsa post yuboradi
    - cron: '*/30 1-18 * * *'   # 06:00-23:00 Toshkent (UTC+5)
  workflow_dispatch:
    inputs:
      category:
        description: 'Rubrika (bo''sh qolsa schedule.json dan oladi)'
        required: false
        default: ''
        type: choice
        options: ['', logo, trend, tip, color, typography, inspiration, tool, mindset]
  repository_dispatch:
    types: [telegram-post]

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pip
        run: pip install requests

      - name: Post
        run: python telegram_bot/post.py
        env:
          TG_BOT_TOKEN:       ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID:      '@deardsgn'
          LEONARDO_API_KEY:   ${{ secrets.LEONARDO_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:        ${{ github.repository }}
          MANUAL_CATEGORY:    ${{ github.event.inputs.category || github.event.client_payload.category || '' }}
          MANUAL_TRIGGER:     ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
